[pytest]
# Run from this directory:  cd simulator ; ..\.venv\Scripts\python -m pytest -q
testpaths = tests
python_files = test_*.py

# `pythonpath = .` makes `import simulator...` work from here; `../backend/fastapi`
# makes `import app...` work, which is what the integration test needs. pytest
# resolves both relative to this file, so no `pip install -e` is required.
pythonpath = . ../backend/fastapi

addopts = -q --basetemp=.pytest_tmp -p no:cacheprovider
# `.pytest_tmp` and `.pytest-work` hold per-test scratch directories; they are
# never test modules, and on some Windows sandboxes they cannot even be listed.
norecursedirs = .pytest_tmp* .pytest-work .venv .ecg-data
filterwarnings =
    ignore::DeprecationWarning
