[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# startapp generates tests.py, which pytest does not collect by default.
python_files = tests.py test_*.py *_tests.py
pythonpath = .
# -p no:cacheprovider: this workspace sits behind a Windows file sandbox that
# denies writes inside .pytest_cache, which turns into a collection error. The
# cache only speeds up `--lf`/`--ff`, so disabling it costs nothing. Two stale
# cache directories (`pytest-cache-files-88wctrkw`, `.pytest_cache`) were created
# before this option existed and cannot be deleted from inside the sandbox, so
# runs add `--ignore=pytest-cache-files-88wctrkw` (see docs/phase-1-notes.md §7).
# --basetemp=.pytest_tmp: pytest's default base temp directory under %TEMP% is
# not writable in this sandbox, so it is pinned inside the project instead (and
# gitignored). pytest recreates it on every run.
addopts = -q -p no:cacheprovider --basetemp=.pytest_tmp
# Test-only secret values live in conftest.py (set before Django settings are
# imported) - config/settings.py has no fallback for either key and raises
# ImproperlyConfigured when one is missing, so the suite would not even collect
# without them. They are obviously fake on purpose.
